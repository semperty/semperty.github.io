# Pings Supabase every 3 days so the free project never pauses
# for inactivity. Runs on GitHub's servers; nothing to install.
#
# Uses the same public (publishable) key that's already in myface.js.
# Never put the secret / service_role key here.

name: Keep Supabase awake

on:
  schedule:
    - cron: "17 14 */3 * *"   # every 3 days at 14:17 UTC
  workflow_dispatch:           # adds a "Run workflow" button for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one note from the board
        env:
          SUPABASE_URL: "https://tkkzlsuixkkbsulrdwci.supabase.co"
          SUPABASE_KEY: "PASTE_PUBLISHABLE_KEY_HERE"
        run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/notes?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY"
          echo ""
          echo "Supabase is awake."